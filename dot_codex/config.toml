model = "gpt-5.5"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_verbosity = "low"
web_search = "live"
approvals_reviewer = "user"
suppress_unstable_features_warning = true

[features]
unified_exec = true
shell_snapshot = true
terminal_resize_reflow = true
fast_mode = true
apps = true
tool_search = true
plugins = true
image_generation = true
prevent_idle_sleep = true
goals = true
external_migration = true
apply_patch_freeform = true
apply_patch_streaming_events = true
exec_permission_approvals = true
request_permissions_tool = true
default_mode_request_user_input = true
tool_search_always_defer_mcp_tools = true
skill_env_var_dependency_prompt = true
# remote_compaction_v2 = true
builtin_mcp = true
memories = true

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 6
min_wait_timeout_ms = 10000

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp", "--api-key", "REPLACE_WITH_CONTEXT7_API_KEY"]
startup_timeout_sec = 3.0

[mcp_servers.wandb]
url = "https://mcp.withwandb.com/mcp"

[mcp_servers.wandb.http_headers]
Authorization = "Bearer REPLACE_WITH_WANDB_TOKEN"
Accept = "application/json, text/event-stream"

[mcp_servers.playwright_mcp]
command = "bunx"
args = ["-y", "@playwright/mcp@latest"]
startup_timeout_sec = 3.0
