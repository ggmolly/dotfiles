# Use 256 colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Status bar position and design
set -g status-position top
set -g status-justify left
set -g status-style "bg=#111319,fg=#E8ECF2"

# Panes styling (sharp borders, pink accent for active)
set -g pane-border-style "fg=#202636"
set -g pane-active-border-style "fg=#E35D8F"
set -g pane-border-lines "single"

# Command line / messages
set -g message-style "bg=#2D354B,fg=#E8ECF2,bold"

# Left module (Session name)
set -g status-left-length 50
set -g status-left "#[fg=#E35D8F,bg=#1A1F2B,bold]  #S #[bg=#111319] "

# Right module (Time and host)
set -g status-right-length 50
set -g status-right "#[fg=#8B93A6,bg=#111319] %H:%M #[fg=#111319,bg=#E35D8F,bold]  #H "

# Window tabs
setw -g window-status-format "#[fg=#8B93A6,bg=#111319] #I:#W "
setw -g window-status-current-format "#[fg=#E8ECF2,bg=#2D354B,bold] #I:#W "
setw -g window-status-separator "#[fg=#3A445E] | "
