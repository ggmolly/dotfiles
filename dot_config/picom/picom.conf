# ---------------------------------------------------
# Backend & Performance
# ---------------------------------------------------
backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
xrender-sync-fence = true;

# ---------------------------------------------------
# Shadows
# ---------------------------------------------------
shadow = true;
shadow-radius = 20;
shadow-offset-x = -20;
shadow-offset-y = -20;
shadow-opacity = 0.4;
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ---------------------------------------------------
# Fading
# ---------------------------------------------------
fading = true;
fade-delta = 4;
fade-in-step = 0.02;
fade-out-step = 0.02;
no-fading-openclose = false;

# ---------------------------------------------------
# Transparency / Opacity
# ---------------------------------------------------
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
  "100:class_g = 'Rofi'",
  "100:class_g = 'Dunst'",
  "100:class_g = 'Polybar'"
];

# ---------------------------------------------------
# ANIMATIONS (Requires picom-ftlabs-git or picom-animations)
# ---------------------------------------------------
animations = true;
animation-stiffness = 350.0;
animation-dampening = 22.0;
animation-clamping = true;
animation-mass = 1;

# Zoom quand tu ouvres/fermes une fenêtre
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";

# Glissement quand tu changes de workspace
animation-for-workspace-switch-in = "slide-down";
animation-for-workspace-switch-out = "slide-up";

# ---------------------------------------------------
# Corners
# ---------------------------------------------------
corner-radius = 0;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.9; shadow = false; };
  dropdown_menu = { opacity = 0.9; shadow = false; };
};
