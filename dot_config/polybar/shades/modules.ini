[module/space]
type = custom/text
content = "   "

[module/launcher]
type = custom/text
content = "  "
content-foreground = ${color.accent}
click-left = ~/.config/polybar/shades/scripts/launcher.sh &

[module/sysmenu]
type = custom/text
content = " ⏻ "
content-foreground = ${color.accent}
click-left = ~/.config/polybar/shades/scripts/powermenu.sh &

[module/workspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
format = <label-state>
label-active = "  "
label-occupied = "  "
label-urgent = "  "
label-empty = "  "
label-active-foreground = ${color.accent}
label-occupied-foreground = ${color.foreground-alt}
label-empty-foreground = #2D354B
label-urgent-foreground = ${color.alert}

[module/date]
type = internal/date
interval = 1.0
time = "%H:%M"
date = "%a, %d %b"
format = <label>
label = "%{F#E35D8F} %{T2}%{F#E8ECF2}%time%%{T-} %{F#3A445E}│ %{T1}%{F#8B93A6}%date%%{T-}"

[module/wired-network]
type = internal/network
interface = enp8s0
format-connected = <label-connected>
format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${color.accent}
label-connected = " %{F#8B93A6}%local_ip% %{F#3A445E}│ %{F#E35D8F}󰇚 %{F#8B93A6}%downspeed% %{F#3A445E}│ %{F#E35D8F}󰕒 %{F#8B93A6}%upspeed%"
format-disconnected = ""

[module/updates]
type = custom/script
exec = ~/.config/polybar/shades/scripts/updates.sh
tail = true
interval = 60
format = <label>
format-prefix = "󰏖 "
format-prefix-foreground = ${color.accent}
label = " %output%"
click-left = alacritty &

[module/opencode]
type = custom/script
exec = ~/.config/polybar/shades/scripts/opencode-stats.sh
tail = true
format = <label>
format-prefix = "󰚩 "
format-prefix-foreground = ${color.accent}
label = " %output%"

[module/openai-quota]
type = custom/script
exec = ~/.config/polybar/shades/scripts/openai-quota.sh
tail = true
format = <label>
format-prefix = " "
format-prefix-foreground = ${color.accent}
label = " %output%"

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true
format-mounted = <label-mounted>
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${color.accent}
label-mounted = " %used%"
format-unmounted = ""

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
format = <label-layout>
format-prefix = " "
format-prefix-foreground = ${color.accent}
label-layout = " %layout%"

[module/alsa]
type = internal/alsa
master-soundcard = default
speaker-soundcard = default
headphone-soundcard = default
master-mixer = Master
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = " %percentage%%"
format-muted = <label-muted>
format-muted-prefix = "󰖁 "
format-muted-prefix-foreground = ${color.alert}
label-muted = " Muted"
label-muted-foreground = ${color.foreground-alt}
ramp-volume-0 = "󰕿 "
ramp-volume-1 = "󰖀 "
ramp-volume-2 = "󰕾 "
ramp-volume-foreground = ${color.accent}

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
format-prefix = " "
format-prefix-foreground = ${color.accent}
label = " %percentage%%"

[module/memory]
type = internal/memory
interval = 1
format = <label>
format-prefix = " "
format-prefix-foreground = ${color.accent}
label = " %percentage_used%%"

[module/temperature_cpu]
type = internal/temperature
hwmon-path = /sys/class/hwmon/hwmon5/temp3_input
interval = 1
thermal-zone = 0
warn-temperature = 75
units = true
format = <ramp> <label>
format-warn = <ramp> <label-warn>
label = " %temperature-c%"
label-warn = " %temperature-c%"
label-warn-foreground = ${color.alert}
ramp-0 = " "
ramp-1 = " "
ramp-2 = " "
ramp-3 = " "
ramp-4 = " "
ramp-foreground = ${color.accent}

[module/title]
type = internal/xwindow
format = <label>
format-prefix = "󱂬"
format-prefix-foreground = ${color.accent}
label = " %title%"
label-maxlen = 45
label-empty = " Desktop"
label-empty-foreground = ${color.foreground-alt}

[module/gpu]
type = custom/script
exec = nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader 2>/dev/null || echo "N/A"
interval = 2
format = <label>
format-prefix = "󰢮 "
format-prefix-foreground = ${color.accent}
label = " %output%°C"
