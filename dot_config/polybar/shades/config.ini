[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ~/.config/polybar/shades/colors.ini
include-file = ~/.config/polybar/shades/modules.ini

[bar/main]
monitor =
monitor-fallback =
monitor-strict = false
override-redirect = false
bottom = false
fixed-center = true

width = 100%
height = 40
offset-x = 0
offset-y = 0

background = ${color.background}
foreground = ${color.foreground}

radius = 0
border-bottom-size = 2
border-bottom-color = ${color.accent}

padding = 2
module-margin = 0

font-0 = "BerkeleyMono Nerd Font:style=Regular:size=11;3"
font-1 = "BerkeleyMono Nerd Font:style=Bold:size=11;3"
font-2 = "BerkeleyMono Nerd Font:size=14;4"

modules-left = launcher space workspaces space title
modules-center = date
modules-right = updates space opencode space openai-quota space filesystem space memory space cpu space temperature_cpu space gpu space xkeyboard space alsa space sysmenu

separator = ""
dim-value = 1.0
wm-name = i3
locale = en_US.UTF-8

tray-position = right
tray-detached = false
tray-maxsize = 16
tray-background = ${color.background}
tray-offset-x = 0
tray-offset-y = 0
tray-padding = 2
tray-scale = 1.0
enable-ipc = true

[settings]
throttle-output = 5
throttle-output-for = 10
screenchange-reload = false
pseudo-transparency = false
